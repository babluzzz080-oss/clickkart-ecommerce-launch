function gallery(p){const im=gimgs(p);if(!im.length)return tile(p,330);return `<div class="gal" id="gal" onscroll="galS(this)">${im.map((u,i)=>`<div class="gs" style="background:${cc(p.cat)}" onclick="lb(${i})"><img src="${u}" alt="${esc(p.n)}"></div>`).join("")}</div>${im.length>1?`<span class="gc" id="gc">1/${im.length}</span><div class="gd" id="gd">${im.map(()=>"<i></i>").join("")}</div>`:""}`}
function tstrip(p){const im=gimgs(p);return im.length>1?`<div class="tstrip" id="ts2">${im.map((u,i)=>`<button class="tt ${i?"":"on"}" onclick="galGo(${i})" aria-label="Photo ${i+1}"><img src="${u}" alt=""></button>`).join("")}</div>`:""}
function galGo(i){const g=$("gal");if(g)g.scrollTo({left:i*g.clientWidth,behavior:"smooth"})}
function galS(e){const g=$("gd");if(!e||!g)return;const i=Math.round(e.scrollLeft/e.clientWidth);$("gc").textContent=(i+1)+"/"+g.children.length;[].forEach.call(g.children,(d,k)=>d.className=k==i?"on":"");const t=$("ts2");if(t)[].forEach.call(t.children,(d,k)=>d.classList.toggle("on",k==i))}
function lb(i){const im=gimgs(P(arg));if(!im.length)return;let o=$("lb");if(!o){o=document.createElement("div");o.id="lb";document.body.appendChild(o)}o.innerHTML=`<button class="lbx" onclick="$('lb').style.display='none'" aria-label="Band karein">×</button><div class="lbs" id="lbs">${im.map(u=>`<div class="lbp"><img src="${u}" alt="" onclick="this.classList.toggle('z')"></div>`).join("")}</div><div class="lbc">Tap karke zoom karein · swipe karke agli photo dekhein</div>`;o.style.display="flex";$("lbs").scrollLeft=i*$("lbs").clientWidth}
function pinHtml(p){return `<div class="n2">📍 <input id="pc" class="in" style="width:130px;display:inline;padding:6px" inputmode="numeric" maxlength="6" placeholder="Pincode" aria-label="Pincode"> <button class="b1" style="padding:6px 12px" onclick="chkPin()">Check</button> <span id="pr2"></span></div>`}
function chkPin(){const v=$("pc").value.trim(),d=new Date(Date.now()+4*864e5).toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});$("pr2").textContent=/^\d{6}$/.test(v)?"✅ "+(lang=="en"?"Delivery available by ":"डिलीवरी उपलब्ध: ")+d:(lang=="en"?"Enter a valid pincode":"सही पिनकोड डालें")}
function revHtml(p){const l=S.reviews[p.id]||[];return `<h3>Ratings & Reviews</h3><div class="box">${l.length?l.slice().reverse().map(r=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b style="color:#f59e0b">${"★".repeat(r.r)}${"☆".repeat(5-r.r)}</b> ${esc(r.n)}<br>${esc(r.t)}<br><small>${esc(r.d)}</small></div>`).join(""):"<small>Abhi koi review nahin. Pehle aap likhein!</small>"}${S.user?`<label class="l" for="rv_r">Aapki rating</label><select class="in" id="rv_r"><option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select><textarea class="in" id="rv_t" rows="2" placeholder="Apna review likhein"></textarea><button class="b1 w" onclick="addRev(${p.id})">Review bhejein</button>`:`<button class="b1 w" onclick="go('login')">Review ke liye login karein</button>`}</div>`}
function addRev(id){const t=$("rv_t").value.trim();if(!t)return alert("Review likhein.");(S.reviews[id]=S.reviews[id]||[]).push({n:S.user.name,r:+$("rv_r").value,t,d:now()});save();toast("Review jud gaya");render()}
function capDraft(){["b","n","m","c","d","s"].forEach(k=>{const e=$("p_"+k);if(e)edDraft[k]=e.value})}
function pnew(){edId=0;edImgs=[];edDraft={};render()}
function pedit(id){const p=P(id);edId=id;edImgs=(p.imgs&&p.imgs.length?p.imgs:(p.img?[p.img]:[])).slice();edDraft={};render()}
function pform(p){const d=edDraft,g=(k,v)=>d[k]!==undefined?d[k]:v,im=edImgs;return `<div class="box"><b style="font-size:18px">${p.id?"Product badlein":"Naya product"}</b><label class="l" for="p_b">Brand</label><input class="in" id="p_b" value="${esc(g("b",p.b))}"><label class="l" for="p_n">Product ka naam</label><input class="in" id="p_n" value="${esc(g("n",p.n))}"><div class="f"><div><label class="l" for="p_m">MRP / asli daam (₹)</label><input class="in" id="p_m" type="number" value="${esc(g("m",p.m||""))}"></div><div><label class="l" for="p_c">Category</label><select class="in" id="p_c">${S.cats.map(c=>`<option ${c.n==g("c",p.cat)?"selected":""}>${esc(c.n)}</option>`).join("")}</select></div></div><label class="l" for="p_d">Description</label><textarea class="in" id="p_d" rows="3">${esc(g("d",p.d))}</textarea><label class="l" for="p_s">Stock</label><select class="in" id="p_s"><option value="1">Available</option><option value="0" ${g("s",p.stock===false?"0":"1")=="0"?"selected":""}>Out of stock</option></select><label class="l">Photos (max 5). Pehli photo main hogi. Photo par tap karke scroll hoti hai.</label><div class="thumbs">${im.map((u,i)=>`<div class="th"><img src="${u}" alt="Main banane ke liye tap karein" onclick="mkMain(${i})"><button onclick="rmImg(${i})" aria-label="Photo hatayein">×</button>${i==0?"<em>Main</em>":""}</div>`).join("")}${im.length<5?`<label class="th add" for="p_i" role="button">＋<small>Photo</small></label>`:""}</div><input id="p_i" type="file" accept="image/*" multiple style="display:none" onchange="addImgs(this.files)"><div class="note">Selling price apne aap ${S.disc}% off ke saath banega.</div><button class="pri" onclick="psave(${p.id||0})">${p.id?"Save karein":"Product add karein"}</button><button class="b1 w" onclick="edId=null;render()">Cancel</button></div>`}
function addImgs(fl){capDraft();const L=[...fl].slice(0,5-edImgs.length);let n=L.length;if(!n)return;const done=()=>{if(--n==0)render()};L.forEach(f=>{const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,600/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*s;cv.height=im.height*s;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);edImgs.push(cv.toDataURL("image/jpeg",.75));done()};im.onerror=done;im.src=rd.result};rd.readAsDataURL(f)})}
function rmImg(i){capDraft();edImgs.splice(i,1);render()}
function psave(id){capDraft();const d=edDraft,b=(d.b||"").trim(),n=(d.n||"").trim(),m=+d.m;if(!b||!n||!(m>0))return alert("Brand, naam aur MRP bharein.");const c=S.cats.find(x=>x.n==d.c)||S.cats[0],o={b,n,m,cat:c.n,d:(d.d||"").trim(),stock:d.s!="0",imgs:edImgs.slice(),img:""};if(id)Object.assign(P(id),o);else S.products.unshift(Object.assign({id:Date.now(),e:c.e,r:4.3,rc:"New"},o));save();edId=null;toast("Product save ho gaya");render()}
function renCat(i,v){v=v.trim();if(!v||S.cats.some((c,k)=>k!=i&&c.n==v))return render();const o=S.cats[i].n;S.products.forEach(p=>{if(p.cat==o)p.cat=v});S.banners.forEach(b=>{if(b.to==o)b.to=v});S.cats[i].n=v;save();render()}
function mvCat(i,d){const j=i+d;if(j<0||j>=S.cats.length)return;[S.cats[i],S.cats[j]]=[S.cats[j],S.cats[i]];save();render()}

let flt={r:0,u:0,s:0};
function demoImgs(p){const bg=[["#f5d0fe","#fb7185"],["#bae6fd","#818cf8"],["#fde68a","#fb923c"],["#bbf7d0","#22d3ee"],["#fecaca","#c084fc"]],cap=["Front view","Side view","Close-up","In use"];return cap.map((c,i)=>{const g=bg[(p.id+i)%5],rot=[0,-14,10,-6][i],sz=[190,150,260,170][i];return "data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${g[0]}"/><stop offset="1" stop-color="${g[1]}"/></linearGradient></defs><rect width="400" height="400" fill="url(#g)"/><circle cx="330" cy="70" r="60" fill="#fff" fill-opacity=".25"/><circle cx="60" cy="350" r="80" fill="#fff" fill-opacity=".2"/><text x="200" y="${i==2?250:225}" font-size="${sz}" text-anchor="middle" transform="rotate(${rot} 200 200)">${p.e}</text><rect x="120" y="340" width="160" height="34" rx="17" fill="#000" fill-opacity=".35"/><text x="200" y="363" font-size="17" font-family="sans-serif" fill="#fff" text-anchor="middle">${c}</text></svg>`)})}
function dod(){if(!S.products.length)return"";const p=S.products[Math.floor(Date.now()/864e5)%S.products.length];return `<div class="dod" onclick="go('prod',${p.id})"><div>${tile(p,170)}</div><div class="dd"><small>⭐ DEAL OF THE DAY</small><span class="br">${esc(p.b)}</span><span>${esc(p.n)}</span><div class="pr">${fmt(sp(p.m))}<s>${fmt(p.m)}</s></div><button class="by2" onclick="event.stopPropagation();buy(${p.id})">Buy now</button></div></div>`}
function sug(v){const e=$("sg");if(!e)return;v=v.trim().toLowerCase();e.innerHTML=v.length<2?"":S.products.filter(p=>(p.n+" "+p.b).toLowerCase().includes(v)).slice(0,5).map(p=>`<button class="sgi" onclick="go('prod',${p.id})">${esc(p.b)} ${esc(p.n)} <small>in ${esc(p.cat)}</small></button>`).join("")}
function mkMain(i){capDraft();edImgs.unshift(...edImgs.splice(i,1));render()}
function pdup(id){const p=JSON.parse(JSON.stringify(P(id)));p.id=Date.now();p.n+=" (copy)";S.products.unshift(p);save();toast("Copy ban gayi");render()}
function chart7(){const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+i);return d}),vals=days.map(d=>S.orders.filter(o=>o.ts&&o.st>=0&&o.ts>=d.getTime()&&o.ts<d.getTime()+864e5).reduce((a,o)=>a+o.total,0)),mx=Math.max(1,...vals);return `<div class="box"><b>Pichhle 7 din ki bikri</b><div style="display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:10px">${vals.map((v,i)=>`<div style="flex:1;text-align:center;font-size:11px"><div style="height:${Math.round(v/mx*90)}px;min-height:3px;background:var(--g);border-radius:6px 6px 0 0" title="${fmt(v)}"></div>${days[i].toLocaleDateString("en-IN",{weekday:"short"})}</div>`).join("")}</div></div>`}
function vPolicy(){const K2=[["privacy","Privacy"],["terms","Terms"],["refund","Refund"],["ship","Shipping"],["contact","Contact"]],n=esc(S.name),u=S.sup,k=arg||"privacy";
const tx={privacy:`<h3>Privacy Policy</h3><p>${n} collects your name, mobile number, delivery address and order details only to process orders, deliver products, send order updates and give support.</p><p>Payments are processed by Razorpay. We never store your card, UPI or bank details. We do not sell or rent your personal data.</p><p>To see or delete your data, write to ${esc(u.em)}.</p>`,terms:`<h3>Terms &amp; Conditions</h3><p>All prices are in Indian Rupees (INR). Orders are accepted only with online payment; Cash on Delivery is not available.</p><p>${n} may cancel an order if an item is out of stock or listed at a wrong price, and will refund the full amount.</p><p>Product images are for illustration. Misuse of the website is not allowed. These terms are governed by the laws of India.</p>`,refund:`<h3>Return, Refund &amp; Cancellation</h3><p>You can cancel an order before it is shipped for a full refund. Returns are accepted within 7 days of delivery for damaged, defective or wrong items.</p><p>Write to ${esc(u.em)} or call ${esc(u.ph)} with your order ID and photos. Approved refunds go back to the original payment method within 5 to 7 working days.</p>`,ship:`<h3>Shipping Policy</h3><p>We deliver across India with free delivery. Orders usually arrive in 3 to 5 working days after confirmation. You can track every order in Account &gt; Orders.</p>`,contact:`<h3>Contact Us</h3><p><b>${n}</b></p><p>${esc(S.biz||"Business address: Admin > Settings mein bharein")}</p><p>Email: ${esc(u.em)}<br>Phone: ${esc(u.ph)}<br>Hours: ${esc(u.hr)}</p>`};
return bar("Policies")+`<div class="pg"><div class="tabs">${K2.map(x=>`<button class="chip ${x[0]==k?"on":""}" onclick="arg='${x[0]}';render()">${x[1]}</button>`).join("")}</div><div class="box">${tx[k]}</div></div>`}
S=load();S.products.forEach(p=>{if(!p.imgs&&!p.img&&p.id<=16)p.imgs=demoImgs(p)});applyTheme();render();
</script>
